<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Drop</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e2e2dc; --accent: #2f6fdf; --accent-text: #ffffff;
    --ok: #2e8b57; --warn: #b7791f; --err: #c0392b; --bar: #dfe7f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1f1f1d; --text: #ecece8; --muted: #9a9a93;
      --line: #33332f; --accent: #5b8ff0; --accent-text: #0d1a33;
      --ok: #5cc28a; --warn: #e0a84a; --err: #ef6b5b; --bar: #26324a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; font-size: 1.05rem; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .pick {
    display: block; width: 100%; text-align: center; padding: 16px; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 1.1rem;
    cursor: pointer; border: 0;
  }
  .pick[aria-disabled=true] { opacity: .5; pointer-events: none; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 600; margin-bottom: 10px; }
  .summary span { white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .overall { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .overall div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow-y: auto; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  li:first-child { border-top: 0; }
  li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  li .s { flex-shrink: 0; color: var(--muted); }
  .dest { color: var(--muted); font-size: .8rem; word-break: break-all; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Photo Drop</h1>
  <p class="sub">Send photos from this device straight to the PC.</p>

  <div class="card">
    <label for="set">Photo set name</label>
    <input id="set" type="text" autocomplete="off" autocapitalize="off" placeholder="e.g. clip-scan-1">
    <div class="hint">Each set gets its own folder on the PC. Use a new name for each object you scan.</div>
  </div>

  <div class="card">
    <label class="pick" id="pickLabel" for="files">Choose photos</label>
    <input id="files" type="file" multiple accept="image/*,video/*">
    <div class="hint">Re-sending the same photo is harmless: duplicates are skipped.</div>
  </div>

  <div class="card" id="progressCard" hidden>
    <div class="summary">
      <span class="ok" id="nSaved">0 saved</span>
      <span class="warn" id="nDup">0 duplicates</span>
      <span class="err" id="nFail">0 failed</span>
      <span id="nLeft"></span>
    </div>
    <div class="overall"><div id="bar"></div></div>
    <ul id="list"></ul>
    <div class="dest" id="dest"></div>
  </div>
</main>

<script>
const token = new URLSearchParams(location.search).get("t") || "";
const setInput = document.getElementById("set");
const filesInput = document.getElementById("files");
const pickLabel = document.getElementById("pickLabel");
const list = document.getElementById("list");
const counts = { saved: 0, duplicate: 0, failed: 0 };
let totalBytes = 0, doneBytes = 0, pending = 0;
const inFlight = new Map();

try { setInput.value = localStorage.getItem("photoDropSet") || ""; } catch (e) {}
setInput.addEventListener("input", () => { try { localStorage.setItem("photoDropSet", setInput.value); } catch (e) {} });

fetch("/info?t=" + encodeURIComponent(token)).then(r => r.json()).then(info => {
  if (info.dest) document.getElementById("dest").textContent = "Saving to " + info.dest;
}).catch(() => {});

function render() {
  document.getElementById("nSaved").textContent = counts.saved + " saved";
  document.getElementById("nDup").textContent = counts.duplicate + " duplicate" + (counts.duplicate === 1 ? "" : "s");
  document.getElementById("nFail").textContent = counts.failed + " failed";
  document.getElementById("nLeft").textContent = pending ? pending + " to go" : "Done";
  let live = 0; inFlight.forEach(v => live += v);
  document.getElementById("bar").style.width = totalBytes ? Math.min(100, (doneBytes + live) / totalBytes * 100) + "%" : "0";
  pickLabel.setAttribute("aria-disabled", pending ? "true" : "false");
  pickLabel.textContent = pending ? "Uploading…" : "Choose photos";
}

// Photos up to this size are read fully into memory before sending. On iOS this forces the
// photo to be materialized, which avoids Safari occasionally sending an empty body.
const PRELOAD_LIMIT = 256 * 1024 * 1024;

function uploadOne(file, setName) {
  return new Promise(async resolve => {
    const row = document.createElement("li");
    row.innerHTML = '<span class="n"></span><span class="s">reading</span>';
    row.querySelector(".n").textContent = file.name;
    list.prepend(row);
    const status = row.querySelector(".s");

    let body = file;
    let size = file.size;
    if (size <= PRELOAD_LIMIT) {
      try {
        body = await file.arrayBuffer();
        size = body.byteLength;
      } catch (e) {
        size = 0;
      }
    }

    const xhr = new XMLHttpRequest();
    const q = "set=" + encodeURIComponent(setName) + "&name=" + encodeURIComponent(file.name);
    xhr.open("POST", "/upload?" + q);
    xhr.setRequestHeader("X-Token", token);
    xhr.setRequestHeader("X-Last-Modified", String(file.lastModified || ""));
    xhr.setRequestHeader("X-File-Size", String(size));
    xhr.upload.onprogress = e => {
      inFlight.set(file, e.loaded);
      status.textContent = Math.round(e.loaded / Math.max(size, 1) * 100) + "%";
      render();
    };
    const finish = (kind, text) => {
      inFlight.delete(file);
      doneBytes += file.size;
      counts[kind]++; pending--;
      status.textContent = text;
      status.className = "s " + (kind === "saved" ? "ok" : kind === "duplicate" ? "warn" : "err");
      render(); resolve();
    };
    xhr.onload = () => {
      let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200 && r.status === "saved") finish("saved", "saved");
      else if (xhr.status === 200 && r.status === "duplicate") finish("duplicate", r.of ? "duplicate of " + r.of : "duplicate");
      else finish("failed", r.error || ("error " + xhr.status));
    };
    xhr.onerror = () => finish("failed", "network error");

    if (size === 0) {
      finish("failed", "couldn't read photo, try again");
      return;
    }
    status.textContent = "0%";
    xhr.send(body);
  });
}

filesInput.addEventListener("change", async () => {
  const files = Array.from(filesInput.files);
  filesInput.value = "";
  if (!files.length) return;
  const setName = setInput.value.trim() || ("set-" + new Date().toISOString().slice(0, 10));
  setInput.value = setName;
  try { localStorage.setItem("photoDropSet", setName); } catch (e) {}

  document.getElementById("progressCard").hidden = false;
  pending += files.length;
  totalBytes += files.reduce((a, f) => a + f.size, 0);
  render();

  // Two uploads at a time keeps Wi-Fi busy without overwhelming the phone
  const queue = files.slice();
  const worker = async () => { while (queue.length) await uploadOne(queue.shift(), setName); };
  await Promise.all([worker(), worker()]);
});
</script>
</body>
</html>
