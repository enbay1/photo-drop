<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Drop QR</title>
<style>
  :root { --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1f1f1d; --text: #ecece8; --muted: #9a9a93; --line: #33332f; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; max-width: 420px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  /* The QR code is black on white in the two themes. Thus, phone cameras can read it reliably. */
  #qr { background: #fff; padding: 16px; border-radius: 12px; display: inline-block; line-height: 0; }
  #qr svg { width: min(300px, 70vw); height: auto; }
  .url { margin-top: 18px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; word-break: break-all; }
  .dest { margin-top: 8px; color: var(--muted); font-size: .85rem; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <h1>Scan the code to upload photos</h1>
    <p>Point the phone camera at the code. Then tap the link.</p>
    <div id="qr"></div>
    <div class="url" id="url"></div>
    <div class="dest" id="dest"></div>
  </div>
<script src="/qrcode.min.js"></script>
<script>
fetch("/qrinfo").then(r => r.json()).then(info => {
  const qr = qrcode(0, "M");
  qr.addData(info.url);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  document.getElementById("url").textContent = info.url;
  document.getElementById("dest").textContent = "Save folder: " + info.dest;
});
</script>
</body>
</html>
